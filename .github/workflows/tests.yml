name: API Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar instalação do pytest-timeout
        run: python -c "import pytest_timeout; print('pytest-timeout OK')"

      - name: Executar testes
        run: pytest --tb=short -v --html=report.html --self-contained-html
        continue-on-error: false

      - name: Publicar relatório HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-${{ github.run_number }}
          path: report.html
