name: API Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Executar testes com Allure
        run: pytest --tb=short -v --alluredir=allure-results --html=report.html --self-contained-html
        continue-on-error: false

      - name: Gerar relatorio Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Publicar relatorio Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/

      - name: Publicar relatorio HTML pytest-html
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-html-${{ github.run_number }}
          path: report.html
